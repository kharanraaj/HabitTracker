<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="emerald">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Habit Tracker — Premium Personal Performance &amp; Analytics System. Daily habit tracking, transparent statistics, and actionable insights." />
  <meta name="theme-color" content="#0f1217" />
  <title>Habit Tracker — Personal Performance &amp; Analytics</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Core Application Stylesheets -->
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/tracker.css" />
  <link rel="stylesheet" href="css/analytics.css" />

  <!-- Bundled Local Chart.js (Pinned UMD for 100% offline & local reliability) -->
  <script src="assets/lib/chart.umd.js"></script>
</head>
<body>
  <div id="app">
    <!-- Desktop Sidebar Navigation -->
    <aside id="sidebar" aria-label="Sidebar Navigation">
      <div class="brand-section">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        </div>
        <div class="brand-title-wrap">
          <span class="brand-title">HabitPulse</span>
          <span class="brand-subtitle">Performance OS</span>
        </div>
      </div>

      <nav class="nav-menu" aria-label="Main Navigation">
        <a href="#dashboard" class="nav-link active" data-page="dashboard" id="nav-item-dashboard" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="#tracker" class="nav-link" data-page="tracker" id="nav-item-tracker">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Tracker Grid</span>
        </a>
        <a href="#analytics" class="nav-link" data-page="analytics" id="nav-item-analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Analytics</span>
        </a>
        <a href="#habits" class="nav-link" data-page="habits" id="nav-item-habits">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          <span>Habits</span>
        </a>
        <a href="#settings" class="nav-link" data-page="settings" id="nav-item-settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="storage-status-card">
          <div class="storage-label">
            <span>Storage</span>
            <span class="storage-badge" id="storage-status-badge">Local Sync</span>
          </div>
          <div style="font-size: 11px; color: var(--text-muted); font-feature-settings: 'tnum' 1;" id="sidebar-entries-count">
            0 entries recorded
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div id="main-wrapper">
      <!-- Top Navigation Bar -->
      <header id="top-bar">
        <div class="topbar-left">
          <div class="current-date-badge" id="topbar-date-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span id="current-date-text">Loading date...</span>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Quick theme cycler button -->
          <button class="btn btn-icon btn-sm" id="topbar-theme-toggle" type="button" title="Toggle Theme (Dark / OLED / Light)" aria-label="Toggle Theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="topbar-theme-icon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>

          <!-- Quick track button -->
          <a href="#tracker" class="btn btn-primary btn-sm" id="topbar-track-shortcut">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            <span class="btn-text-label">Quick Log</span>
          </a>
        </div>
      </header>

      <!-- Dynamic Page Container -->
      <main id="page-container" role="main" aria-live="polite">
        <noscript>
          <div class="empty-state" style="margin-top: 40px;">
            <div class="empty-state-title">JavaScript Required</div>
            <div class="empty-state-desc">Habit Tracker runs fully locally in your modern web browser using client-side JavaScript. Please enable JavaScript to access your habits and analytics.</div>
          </div>
        </noscript>
      </main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav id="mobile-nav" aria-label="Mobile Navigation">
      <a href="#dashboard" class="mobile-nav-link active" data-page="dashboard" id="mob-nav-dashboard" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Home</span>
      </a>
      <a href="#tracker" class="mobile-nav-link" data-page="tracker" id="mob-nav-tracker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Tracker</span>
      </a>
      <a href="#analytics" class="mobile-nav-link" data-page="analytics" id="mob-nav-analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Analytics</span>
      </a>
      <a href="#habits" class="mobile-nav-link" data-page="habits" id="mob-nav-habits">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/></svg>
        <span>Habits</span>
      </a>
      <a href="#settings" class="mobile-nav-link" data-page="settings" id="mob-nav-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <!-- Global Toast Container -->
    <div id="toast-container" aria-live="assertive" aria-atomic="true"></div>

    <!-- Accessible Global Modal Structure -->
    <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal-card" id="modal-card">
        <div class="modal-header">
          <h2 class="modal-title" id="modal-title">Modal Title</h2>
          <button class="btn btn-icon btn-sm btn-icon-ghost" id="modal-close-btn" type="button" aria-label="Close modal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
      </div>
    </div>
  </div>


    <!-- Embedded View Templates for 100% Offline, Fast & Resilient Navigation -->
    <template id="template-dashboard">
<div class="page-view" id="dashboard-view">
  <div class="page-header">
    <div class="page-header-text">
      <h1>Daily Command Center</h1>
      <p id="dashboard-subtitle">Track, understand, and refine your daily personal performance.</p>
    </div>
    <div class="page-header-actions">
      <button class="btn btn-primary" id="dash-quick-track-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Open Tracker</span>
      </button>
      <button class="btn btn-secondary" id="dash-add-habit-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>New Habit</span>
      </button>
    </div>
  </div>

  <div class="dashboard-grid">
    <!-- Left Hero Column -->
    <div style="display: flex; flex-direction: column; gap: var(--space-6);">
      <!-- Daily Progress Ring Card -->
      <div class="hero-card" id="hero-progress-card">
        <div class="ring-wrapper">
          <svg class="progress-ring-svg" viewBox="0 0 160 160" aria-hidden="true">
            <circle class="ring-bg" cx="80" cy="80" r="70" stroke-width="12"></circle>
            <circle class="ring-indicator" id="hero-ring-indicator" cx="80" cy="80" r="70" stroke-width="12"
              stroke-dasharray="439.82" stroke-dashoffset="439.82"></circle>
          </svg>
          <div class="ring-inner-content">
            <span class="ring-percent" id="hero-ring-percent">0%</span>
            <span class="ring-subtext" id="hero-ring-ratio">0 of 0 habits</span>
          </div>
        </div>
        <h2 style="font-size: var(--text-lg); font-weight: 700; color: var(--text-primary); margin-top: var(--space-2);">Today's Completion</h2>
        <div class="status-message-banner" id="hero-status-message">
          Loading today's status...
        </div>
        <div class="hero-stats-row">
          <div class="hero-stat-item">
            <span class="hero-stat-val" id="hero-stat-active">0</span>
            <span class="hero-stat-lbl">Active Today</span>
          </div>
          <div class="hero-stat-item">
            <span class="hero-stat-val" id="hero-stat-completed">0</span>
            <span class="hero-stat-lbl">Completed</span>
          </div>
          <div class="hero-stat-item">
            <span class="hero-stat-val" id="hero-stat-remaining">0</span>
            <span class="hero-stat-lbl">Pending</span>
          </div>
        </div>
      </div>

      <!-- 7-Day Completion Strip -->
      <div class="card">
        <div class="card-header">
          <div class="card-title-group">
            <h3 class="card-title">Past 7 Days Consistency</h3>
            <span class="card-subtitle">Daily completion rates over the last week</span>
          </div>
        </div>
        <div class="completion-strip" id="dashboard-strip">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Actionable Insight Highlight -->
      <div class="card insight-highlight-card" id="dashboard-insight-card">
        <div class="insight-category-tag" id="dash-insight-tag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
          <span id="dash-insight-category">Data Insight</span>
        </div>
        <p class="insight-text" id="dash-insight-text">
          Track habits consistently to discover meaningful behavioral patterns and insights.
        </p>
        <div class="insight-evidence" id="dash-insight-evidence">
          <span id="dash-insight-evidence-text">Minimum 7 days of tracking recommended</span>
        </div>
      </div>
    </div>

    <!-- Right Main Column -->
    <div style="display: flex; flex-direction: column; gap: var(--space-6);">
      <!-- Today's Quick Log Snapshot -->
      <div class="card">
        <div class="card-header">
          <div class="card-title-group">
            <h3 class="card-title">Today's Habits</h3>
            <span class="card-subtitle">Quick-entry for scheduled habits</span>
          </div>
          <span class="badge badge-accent" id="dash-today-date-badge">Today</span>
        </div>
        <div class="quick-habit-list" id="dashboard-quick-list">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Streak & Personal Record Highlights -->
      <div class="card">
        <div class="card-header">
          <div class="card-title-group">
            <h3 class="card-title">Active Streaks & Records</h3>
            <span class="card-subtitle">Longest streaks and sustained consistency</span>
          </div>
          <a href="#analytics" class="btn btn-sm btn-ghost">Full Analytics &rarr;</a>
        </div>
        <div class="streak-cards-grid" id="dashboard-streaks-grid">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Weekly Trend Mini Chart -->
      <div class="card">
        <div class="card-header">
          <div class="card-title-group">
            <h3 class="card-title">Weekly Trend</h3>
            <span class="card-subtitle">Completion rate over recent weeks</span>
          </div>
        </div>
        <div class="chart-canvas-wrap" style="height: 180px;">
          <canvas id="dashboardTrendCanvas"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

    </template>

    <template id="template-tracker">
<div class="page-view" id="tracker-view">
  <div class="page-header">
    <div class="page-header-text">
      <h1>Daily Tracker</h1>
      <p>Log your daily habits with precision, zero friction, and instant feedback.</p>
    </div>
    <div class="page-header-actions">
      <!-- View mode switch -->
      <div class="view-mode-tabs" role="tablist" aria-label="Tracker View Modes">
        <button class="view-mode-tab active" id="tab-mode-grid" role="tab" aria-selected="true" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Weekly Grid</span>
        </button>
        <button class="view-mode-tab" id="tab-mode-focus" role="tab" aria-selected="false" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          <span>Daily Focus</span>
        </button>
      </div>

      <button class="btn btn-secondary btn-sm" id="tracker-undo-btn" type="button" title="Undo last edit (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        <span>Undo</span>
      </button>
    </div>
  </div>

  <!-- Date Navigator Bar -->
  <div class="card" style="padding: var(--space-3) var(--space-4);">
    <div class="tracker-view-controls">
      <div class="date-nav-bar">
        <button class="btn btn-icon btn-sm" id="nav-prev-week-btn" type="button" title="Previous Week" aria-label="Previous Week">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <button class="btn btn-secondary btn-sm" id="nav-today-btn" type="button">Today</button>
        <button class="btn btn-icon btn-sm" id="nav-next-week-btn" type="button" title="Next Week" aria-label="Next Week">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
        <span class="date-nav-title" id="tracker-date-range-label">Oct 19 – Oct 25, 2026</span>
      </div>

      <div style="display: flex; align-items: center; gap: var(--space-3);">
        <input type="date" class="form-input" id="tracker-jump-date-picker" style="padding: 0.35rem 0.65rem; font-size: var(--text-xs); width: auto;" title="Jump to specific date" />
      </div>
    </div>
  </div>

  <!-- MODE 1: Weekly Grid View -->
  <div id="tracker-grid-container" class="grid-wrapper">
    <table class="tracker-table" id="weekly-tracker-table">
      <thead>
        <tr id="tracker-table-header-row">
          <th>Habit & Target</th>
          <!-- Days populated dynamically by tracker.js -->
        </tr>
      </thead>
      <tbody id="tracker-table-body">
        <!-- Habit rows populated dynamically by tracker.js -->
      </tbody>
    </table>
  </div>

  <!-- Legend & Accessibility Note -->
  <div class="card" id="tracker-legend-card" style="padding: var(--space-3) var(--space-4);">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3); font-size: var(--text-xs); color: var(--text-secondary);">
      <div style="display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap;">
        <span style="display: flex; align-items: center; gap: 6px;">
          <span class="badge badge-success">&#10003; Target Met</span>
        </span>
        <span style="display: flex; align-items: center; gap: 6px;">
          <span class="badge badge-warning">&frac12; Partial</span>
        </span>
        <span style="display: flex; align-items: center; gap: 6px;">
          <span class="badge badge-danger">&#10005; Missed / Violation</span>
        </span>
        <span style="display: flex; align-items: center; gap: 6px;">
          <span class="badge badge-neutral">&ndash; Skipped</span>
        </span>
        <span style="display: flex; align-items: center; gap: 6px;">
          <span style="border: 1px dashed var(--border-strong); padding: 2px 6px; border-radius: var(--radius-sm);">Not Recorded</span>
        </span>
      </div>
      <div style="font-size: 11px; color: var(--text-muted);">
        Click any cell to update or cycle status &bull; Keyboard: Tab &amp; Enter
      </div>
    </div>
  </div>

  <!-- MODE 2: Daily Focus View -->
  <div id="tracker-focus-container" class="focus-view-container" style="display: none;">
    <div class="card" style="padding: var(--space-4);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div>
          <h2 style="font-size: var(--text-md); font-weight: 700; color: var(--text-primary);" id="focus-date-title">Today's Focus</h2>
          <span style="font-size: var(--text-xs); color: var(--text-muted);" id="focus-summary-text">0 of 0 habits completed</span>
        </div>
        <span class="badge badge-accent" id="focus-completion-pill">0% Complete</span>
      </div>
    </div>

    <div class="focus-habits-list" id="focus-habits-list" style="display: flex; flex-direction: column; gap: var(--space-4);">
      <!-- Populated dynamically by tracker.js -->
    </div>

    <!-- Daily Reflection Prompt -->
    <div class="card reflection-card" id="focus-reflection-card">
      <div class="card-header" style="margin-bottom: var(--space-2);">
        <h3 class="card-title" style="font-size: var(--text-sm);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px; color: var(--accent-base);"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Daily Note &amp; Reflection
        </h3>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <textarea class="form-textarea" id="focus-daily-note" rows="2" placeholder="What went well today? What will you adjust tomorrow?"></textarea>
      </div>
